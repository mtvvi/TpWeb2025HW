<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Web</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSRF Token для AJAX -->
  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(c => {
          const [k,v] = c.trim().split('=');
          if (k === name) cookieValue = decodeURIComponent(v);
        });
      }
      return cookieValue;
    }
    $.ajaxSetup({ headers: { 'X-CSRFToken': getCookie('csrftoken') } });
  </script>

  <!-- AJAX для лайков -->
  <script>
    $(document).on('click', '.btn-like', function(e) {
      e.preventDefault();
      const btn = $(this);

      // Если кнопка уже отключена (например, если пользователь не аутентифицирован и кнопки отображаются как disabled)
      // Это может быть не нужно, если вы полностью скрываете кнопки для неаутентифицированных пользователей,
      // но полезно, если они отображаются как disabled.
      if (btn.prop('disabled')) {
          return;
      }

      btn.prop('disabled', true); // Отключаем кнопку сразу, чтобы предотвратить двойные клики

      const type = btn.data('type');
      const id = btn.data('id');
      const value = btn.data('value');
      const url = type === 'question'
        ? '{% url "ajax_like_question" %}' // Убедитесь, что эти имена URL-ов правильные
        : '{% url "ajax_like_answer" %}';   // и существуют в вашем urls.py

      $.post(url, { id: id, value: value }) // Явно указываем имена ключей для ясности
        .done(data => {
          // Обновляем значение рейтинга
          btn.closest('.d-flex').find('.rating-value').text(data.rating);

        })
        .fail((jqXHR, textStatus, errorThrown) => {
          let errorMsg = 'Ошибка при голосовании. Пожалуйста, попробуйте позже.';
          if (jqXHR.status === 403) { // Forbidden - скорее всего, пользователь не аутентифицирован
            errorMsg = 'Пожалуйста, войдите в систему, чтобы голосовать.';
            
          } else if (jqXHR.status === 400) { // Bad Request
            errorMsg = 'Ошибка в запросе. Данные некорректны.';
          } else if (jqXHR.status === 401) { // Unauthorized (менее вероятно с @login_required, но возможно при других настройках)
             errorMsg = 'Вы не авторизованы для выполнения этого действия.';
          }
          // Вы можете добавить обработку других кодов ошибок по необходимости
          
          alert(errorMsg);
          btn.prop('disabled', false); // Включаем кнопку обратно при ошибке, чтобы пользователь мог попробовать снова
        });

    });
  </script>

  <!-- base.html (фрагмент AJAX для отметки правильного ответа) -->
  <script>
    $(document).on('change', '.mark-correct', function() {
      const chk = $(this);
     
      const qid = chk.data('question');
      const aid = chk.data('answer');
      const isChecked = chk.is(':checked'); // Получаем текущее состояние чекбокса (true/false)

      // Перед отправкой запроса, применяем стили к карточке в соответствии с новым состоянием
      const answerCard = chk.closest('.card.mb-3');
      if (isChecked) {
          answerCard.addClass('border-success border-3');
      } else {
          answerCard.removeClass('border-success border-3');
      }

      $.post('{% url "ajax_mark_correct" %}', { 
          question: qid, 
          answer: aid,
          checked: isChecked // Передаем состояние чекбокса на сервер
      })
      .done(data => {
          const targetCheckbox = $(`.mark-correct[data-answer="${data.answer_id}"]`);
          const targetCard = targetCheckbox.closest('.card.mb-3');

          targetCheckbox.prop('checked', data.is_correct); // Устанавливаем состояние из ответа сервера
          
          if (data.is_correct) {
              targetCard.addClass('border-success border-3');
          } else {
              targetCard.removeClass('border-success border-3');
          }
          
      })
      .fail(() => {
          alert('Ошибка при выборе правильного ответа. Пожалуйста, попробуйте снова.');
          // В случае ошибки, откатываем состояние измененного чекбокса и карточки
          const currentCard = chk.closest('.card.mb-3');
          chk.prop('checked', !isChecked); // Возвращаем чекбокс в предыдущее состояние
          if (!isChecked) { // Если он был не отмечен, а стал отмечен (и ошибка)
              currentCard.addClass('border-success border-3');
          } else { // Если он был отмечен, а стал не отмечен (и ошибка)
              currentCard.removeClass('border-success border-3');
          }
      })
      .always(() => {
          // chk.prop('disabled', false); // Если отключали
      });
    });
  </script>
</head>
<body class="d-flex flex-column min-vh-100">
  {% include 'components/header.html' %}
  
  {% block content %}{% endblock %}
  
  {% include 'components/footer.html' %}
</body>
</html>
