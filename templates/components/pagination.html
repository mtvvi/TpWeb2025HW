<nav aria-label="Page navigation">
    <ul class="pagination">
      {% if questions.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?page={{ questions.previous_page_number }}">&laquo;</a>
        </li>
      {% endif %}
      
      {% for num in questions.paginator.page_range %}
        {% if num == questions.number %}
          <li class="page-item active">
            <span class="page-link">{{ num }}</span>
          </li>
        {% else %}
          <li class="page-item">
            <a class="page-link" href="?page={{ num }}">{{ num }}</a>
          </li>
        {% endif %}
      {% endfor %}
      
      {% if questions.has_next %}
        <li class="page-item">
          <a class="page-link" href="?page={{ questions.next_page_number }}">&raquo;</a>
        </li>
      {% endif %}
    </ul>
  </nav>
