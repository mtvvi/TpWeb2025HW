<!doctype html>
{% extends "components/base.html" %}
{% load static %}


    {% block content %}
    <main class="container-fluid">
        <div class="row">
            <section class="col-1"></section>
            <section class="col-8">
                <div class="row mb-5">
                    <div class="col-2 text-center mt-3">
                        <img src="{% static 'img/Cover.jpg' %}" alt="Avatar" class="img-fluid rounded mb-3" style="width: 200px; height: autp;">
                        
                    </div>
                    <div class="col-10 mt-3">
                        <h1>Sr. Pupkin</h1>
                        <div class="mt-3">
                            <label for="avatar_upload" class="btn btn-sm btn-outline-secondary">Change Avatar</label>
                            <input type="file" id="avatar_upload" style="display: none;">
                        </div>
                    </div>
                </div>
                
                <h2 class="mb-4">Settings</h2>
                <form>
                    <div class="mb-3 row">
                        <label for="username" class="col-sm-2 col-form-label">Login</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="login" value="sr_Pupkin">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="username" class="col-sm-2 col-form-label">Username</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="username" value="Sr. Pupkin">
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <label for="email" class="col-sm-2 col-form-label">Email</label>
                        <div class="col-sm-10">
                            <input type="email" class="form-control" id="email" value="srpupkin@gmail.com">
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <label for="password" class="col-sm-2 col-form-label">New Password</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control" id="password" placeholder="type">
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <label for="confirm_password" class="col-sm-2 col-form-label">Confirm Password</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control" id="confirm_password" placeholder="confirm">
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <div class="col-sm-10 offset-sm-2">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </div>
                </form>
            </section>

            {% include 'components/aside.html' %}
        </div>
    </main>
    {% endblock content %}
